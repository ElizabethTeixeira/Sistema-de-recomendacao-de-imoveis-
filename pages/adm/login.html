<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login do Administrador · Sistema de Recomendação de Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="./login.css" />
</head>
<body class="pagina-auth pagina-auth--adm">
  <main class="auth-caixa">
    <a class="auth-voltar" href="../../index.html">← Voltar</a>
    <div class="auth-cartao superficie cartao-sombra">
      <div class="auth-cabecalho">
        <div class="auth-icone">🛡️</div>
        <h1>Painel Administrativo</h1>
        <p class="texto-suave">Acesso restrito à equipe administrativa.</p>
      </div>

      <form id="form-login-adm" novalidate>
        <div class="form-grupo">
          <label for="email">E-mail</label>
          <input class="input" type="email" id="email" name="email" autocomplete="username" required />
        </div>
        <div class="form-grupo">
          <label for="senha">Senha</label>
          <input class="input" type="password" id="senha" name="senha" autocomplete="current-password" required />
        </div>
        <p id="mensagem-erro" class="campo-erro" role="alert"></p>
        <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
      </form>

      <p class="auth-dica texto-suave">Demonstração: adm@email.com / adm@senha.com</p>
    </div>
  </main>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/hash.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/seed.js"></script>
  <script src="./login.js"></script>
</body>
</html>
