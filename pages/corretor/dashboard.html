<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus imóveis · Corretor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="container spacer-topo">
    <div class="flex-entre">
      <div>
        <h1>Meus imóveis</h1>
        <p class="texto-suave">Cadastre, edite e acompanhe o status dos seus imóveis.</p>
      </div>
      <a class="btn btn-primario" href="imovel-form.html">+ Novo imóvel</a>
    </div>

    <div id="grade-meus-imoveis" class="grade-meus-imoveis spacer-topo"></div>
    <p id="estado-vazio-meus-imoveis" class="estado-vazio" hidden>
      <span class="icone">🏠</span><br />Você ainda não cadastrou nenhum imóvel.
    </p>
  </main>

  <div class="overlay" id="overlay-mensagens" hidden>
    <div class="modal modal--largo">
      <div class="modal__cabecalho">
        <h3>Mensagens de clientes</h3>
        <button class="modal__fechar" id="fechar-mensagens" type="button" aria-label="Fechar">✕</button>
      </div>
      <div class="modal__corpo">
        <div id="lista-conversas" class="lista-conversas"></div>
        <p id="estado-vazio-conversas" class="estado-vazio" hidden>
          <span class="icone">✉️</span><br />Você ainda não recebeu mensagens.
        </p>
      </div>
    </div>
  </div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/hash.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/seed.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
