<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu perfil · Corretor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="./perfil.css" />
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="container spacer-topo largura-perfil">
    <h1>Meu perfil</h1>
    <p class="texto-suave">Atualize suas informações pessoais, CRECI e dados de acesso.</p>

    <form id="form-perfil" class="superficie superficie-pad cartao-sombra spacer-topo" novalidate>
      <div class="form-grupo">
        <label for="foto">Foto</label>
        <div class="linha-foto">
          <img id="preview-foto" class="avatar" alt="Pré-visualização da foto" src="../../src/img_corretor/foto1.svg" />
          <input class="input" type="file" id="foto" accept="image/*" />
        </div>
      </div>

      <div class="form-grupo">
        <label for="nome">Nome completo</label>
        <input class="input" id="nome" required />
      </div>
      <div class="form-linha">
        <div class="form-grupo">
          <label for="telefone">Telefone</label>
          <input class="input" id="telefone" placeholder="(00) 00000-0000" required />
        </div>
        <div class="form-grupo">
          <label for="cpf">CPF</label>
          <input class="input" id="cpf" placeholder="000.000.000-00" required />
        </div>
      </div>
      <div class="form-linha">
        <div class="form-grupo">
          <label for="dataNascimento">Data de nascimento</label>
          <input class="input" type="date" id="dataNascimento" required />
        </div>
        <div class="form-grupo">
          <label for="creci">CRECI</label>
          <input class="input" id="creci" placeholder="000000-UF" required />
        </div>
      </div>
      <div class="form-grupo">
        <label for="email">E-mail</label>
        <input class="input" type="email" id="email" required />
      </div>
      <div class="form-linha">
        <div class="form-grupo">
          <label for="nova-senha">Nova senha</label>
          <input class="input" type="password" id="nova-senha" autocomplete="new-password" />
          <span class="campo-ajuda">Deixe em branco para manter a senha atual.</span>
        </div>
        <div class="form-grupo">
          <label for="confirmar-senha">Confirmar nova senha</label>
          <input class="input" type="password" id="confirmar-senha" autocomplete="new-password" />
        </div>
      </div>
      <p id="erro-perfil" class="campo-erro" role="alert"></p>
      <div class="form-acoes">
        <button type="submit" class="btn btn-primario">Salvar alterações</button>
      </div>
    </form>
  </main>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/hash.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/masks.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/seed.js"></script>
  <script src="./perfil.js"></script>
</body>
</html>
