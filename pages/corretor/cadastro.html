<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta de Corretor · Sistema de Recomendação de Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="./cadastro.css" />
</head>
<body class="pagina-auth">
  <main class="auth-caixa auth-caixa--larga">
    <a class="auth-voltar" href="../../index.html">← Voltar</a>
    <div class="auth-cartao superficie cartao-sombra">
      <div class="auth-cabecalho">
        <div class="auth-icone">🏘️</div>
        <h1>Criar conta de Corretor</h1>
        <p class="texto-suave">Cadastre-se para anunciar seus imóveis na plataforma.</p>
      </div>

      <form id="form-cadastro-corretor" novalidate>
        <div class="form-grupo">
          <label for="foto">Foto</label>
          <div class="linha-foto">
            <img id="preview-foto" class="avatar" alt="Pré-visualização da foto" src="../../src/img_corretor/foto1.svg" />
            <input class="input" type="file" id="foto" accept="image/*" />
          </div>
        </div>

        <div class="form-grupo">
          <label for="nome">Nome completo</label>
          <input class="input" id="nome" name="nome" required />
        </div>
        <div class="form-linha">
          <div class="form-grupo">
            <label for="telefone">Telefone</label>
            <input class="input" id="telefone" name="telefone" placeholder="(00) 00000-0000" required />
          </div>
          <div class="form-grupo">
            <label for="cpf">CPF</label>
            <input class="input" id="cpf" name="cpf" placeholder="000.000.000-00" required />
          </div>
        </div>
        <div class="form-linha">
          <div class="form-grupo">
            <label for="dataNascimento">Data de nascimento</label>
            <input class="input" type="date" id="dataNascimento" name="dataNascimento" required />
          </div>
          <div class="form-grupo">
            <label for="creci">CRECI</label>
            <input class="input" id="creci" name="creci" placeholder="000000-UF" required />
          </div>
        </div>
        <div class="form-grupo">
          <label for="email">E-mail</label>
          <input class="input" type="email" id="email" name="email" required />
        </div>
        <div class="form-linha">
          <div class="form-grupo">
            <label for="senha">Senha</label>
            <input class="input" type="password" id="senha" name="senha" autocomplete="new-password" required />
          </div>
          <div class="form-grupo">
            <label for="confirmarSenha">Confirmar senha</label>
            <input class="input" type="password" id="confirmarSenha" name="confirmarSenha" autocomplete="new-password" required />
          </div>
        </div>
        <p id="mensagem-erro" class="campo-erro" role="alert"></p>
        <button type="submit" class="btn btn-primario btn-bloco">Criar conta</button>
      </form>

      <p class="auth-rodape">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/hash.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/masks.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/seed.js"></script>
  <script src="./cadastro.js"></script>
</body>
</html>
