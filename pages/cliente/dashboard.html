<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imóveis recomendados · Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="container spacer-topo">
    <h1>Encontre o seu imóvel ideal</h1>
    <p class="texto-suave">Descreva o que procura ou use os filtros ao lado para refinar sua busca.</p>

    <div class="busca-topo spacer-topo">
      <input class="input" id="campo-busca" placeholder="Ex: apartamento no centro com piscina" />
      <button class="btn btn-primario" id="btn-buscar" type="button">Buscar</button>
      <button class="btn btn-secundario btn-filtros-mobile" id="btn-abrir-filtros" type="button">☰ Filtros</button>
    </div>

    <div class="layout-busca spacer-topo">
      <aside id="aside-filtros" class="aside-filtros superficie">
        <div class="aside-filtros__cabecalho">
          <h3>Filtros</h3>
          <button class="fechar-filtros-mobile" id="fechar-filtros-mobile" type="button" aria-label="Fechar filtros">✕</button>
        </div>

        <div class="form-grupo">
          <label for="filtro-tipo">Tipo de imóvel</label>
          <select class="input" id="filtro-tipo"><option value="">Todos os tipos</option></select>
        </div>
        <div class="form-grupo">
          <label for="filtro-bairro">Bairro</label>
          <input class="input" id="filtro-bairro" placeholder="Ex: Centro" />
        </div>
        <div class="form-linha">
          <div class="form-grupo">
            <label for="filtro-preco-min">Preço mín.</label>
            <input class="input" type="number" id="filtro-preco-min" min="0" placeholder="R$ 0" />
          </div>
          <div class="form-grupo">
            <label for="filtro-preco-max">Preço máx.</label>
            <input class="input" type="number" id="filtro-preco-max" min="0" placeholder="R$ 0" />
          </div>
        </div>
        <div class="form-grupo">
          <label for="filtro-quartos">Quartos (mínimo)</label>
          <select class="input" id="filtro-quartos">
            <option value="">Qualquer quantidade</option>
            <option value="1">1+</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
            <option value="4">4+</option>
          </select>
        </div>
        <div class="form-grupo">
          <label for="filtro-vagas">Vagas (mínimo)</label>
          <select class="input" id="filtro-vagas">
            <option value="">Qualquer quantidade</option>
            <option value="1">1+</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
          </select>
        </div>

        <div class="aside-filtros__acoes">
          <button class="btn btn-primario btn-bloco" id="btn-aplicar-filtros" type="button">Aplicar filtros</button>
          <button class="btn btn-texto btn-bloco" id="btn-limpar-filtros" type="button">Limpar tudo</button>
        </div>
      </aside>

      <div class="fundo-filtros-mobile" id="fundo-filtros-mobile" hidden></div>

      <section class="resultado-busca">
        <p id="contador-resultados" class="texto-suave"></p>
        <div id="grade-imoveis" class="grade-imoveis"></div>
        <p id="estado-vazio-imoveis" class="estado-vazio" hidden>
          <span class="icone">🔍</span><br />Nenhum imóvel encontrado com esses critérios.
        </p>
      </section>
    </div>
  </main>

  <div class="overlay" id="overlay-imovel" hidden>
    <div class="modal modal--largo">
      <div class="modal__cabecalho">
        <h3 id="detalhe-titulo">Detalhes do imóvel</h3>
        <button class="modal__fechar" id="fechar-detalhe-imovel" type="button" aria-label="Fechar">✕</button>
      </div>
      <div class="modal__corpo">
        <div class="detalhe-imovel">
          <div class="detalhe-imovel__galeria">
            <img id="detalhe-foto-principal" alt="Foto do imóvel" />
            <div id="detalhe-miniaturas" class="detalhe-miniaturas"></div>
          </div>
          <div class="detalhe-imovel__info">
            <span id="detalhe-badge-compat" class="badge badge-menta" hidden></span>
            <h2 id="detalhe-preco"></h2>
            <p id="detalhe-localizacao" class="texto-suave"></p>
            <div id="detalhe-specs" class="detalhe-specs"></div>
            <div id="detalhe-caracteristicas" class="detalhe-caracteristicas"></div>

            <div class="detalhe-corretor">
              <img id="corretor-foto" class="avatar" alt="Foto do corretor" />
              <div>
                <p class="detalhe-corretor__nome" id="corretor-nome"></p>
                <p class="texto-suave" id="corretor-contato"></p>
              </div>
            </div>

            <button class="btn btn-primario btn-bloco" id="btn-mostrar-mensagem" type="button">✉ Enviar mensagem ao corretor</button>

            <form id="form-mensagem" class="form-mensagem" hidden>
              <div class="form-grupo">
                <label for="texto-mensagem">Sua mensagem</label>
                <textarea class="input" id="texto-mensagem" rows="3" placeholder="Olá! Tenho interesse neste imóvel..." required></textarea>
              </div>
              <div class="form-mensagem__acoes">
                <button type="button" class="btn btn-secundario" id="cancelar-mensagem">Cancelar</button>
                <button type="submit" class="btn btn-destaque">Enviar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay-mensagens" hidden>
    <div class="modal modal--largo">
      <div class="modal__cabecalho">
        <h3>Minhas mensagens</h3>
        <button class="modal__fechar" id="fechar-mensagens" type="button" aria-label="Fechar">✕</button>
      </div>
      <div class="modal__corpo">
        <div id="lista-conversas" class="lista-conversas"></div>
        <p id="estado-vazio-conversas" class="estado-vazio" hidden>
          <span class="icone">✉️</span><br />Você ainda não enviou mensagens a nenhum corretor.
        </p>
      </div>
    </div>
  </div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/hash.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/seed.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
